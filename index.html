<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLY (Mesh/Point Cloud) to GLB</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; text-align: center; margin-bottom: 5px;}
        p.subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-top: 0; }
        label { font-weight: bold; font-size: 0.9rem; margin-top: 10px;}
        input[type="file"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        button {
            margin-top: 15px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #status { font-size: 0.9rem; text-align: center; color: #555; font-weight: bold; margin-top: 10px; min-height: 20px;}
    </style>
</head>
<body>

    <div class="container">
        <h2>Konverter PLY ke GLB</h2>
        <p class="subtitle">(Support Point Cloud & Solid Mesh)</p>
        
        <label>1. Masukkan File Model (.ply)</label>
        <input type="file" id="plyInput" accept=".ply">

        <label>2. Masukkan File Tekstur (.jpg / .png) - Opsional</label>
        <input type="file" id="textureInput" accept="image/png, image/jpeg">
        <small style="color:#777; font-size: 0.75rem;">*Jika model adalah Point Cloud, gambar akan menjadi corak titik-titiknya.</small>

        <button id="convertBtn">Konversi & Download .GLB</button>
        <div id="status"></div>
    </div>

    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <!-- Setup Import Map untuk mengambil Three.js dari CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        const plyInput = document.getElementById('plyInput');
        const textureInput = document.getElementById('textureInput');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');

        convertBtn.addEventListener('click', async () => {
            if (!plyInput.files.length) {
                alert('Harap pilih file .ply terlebih dahulu!');
                return;
            }

            status.style.color = "#007bff";
            status.innerText = "Memproses... Mohon tunggu.";
            convertBtn.disabled = true;

            try {
                // 1. Baca file PLY
                const plyFile = plyInput.files[0];
                const plyBuffer = await plyFile.arrayBuffer();
                
                const plyLoader = new PLYLoader();
                const geometry = plyLoader.parse(plyBuffer);
                
                let object3D;

                // 2. Cek apakah ini Point Cloud (tidak punya index face) atau Mesh Solid
                if (geometry.index === null) {
                    console.log("Point Cloud terdeteksi!");
                    
                    // Material khusus untuk Point Cloud
                    const pointsMaterial = new THREE.PointsMaterial({
                        size: 0.05, // Ukuran titik (ubah jika titik terlalu besar/kecil di hasil akhir)
                        vertexColors: geometry.hasAttribute('color'), // Pertahankan warna asli
                        sizeAttenuation: true
                    });

                    // Jika ada tekstur dimasukkan ke point cloud
                    if (textureInput.files.length > 0) {
                        const texFile = textureInput.files[0];
                        const texUrl = URL.createObjectURL(texFile);
                        const textureLoader = new THREE.TextureLoader();
                        const texture = await textureLoader.loadAsync(texUrl);
                        texture.colorSpace = THREE.SRGBColorSpace;
                        
                        pointsMaterial.map = texture;
                        pointsMaterial.transparent = true;
                        pointsMaterial.alphaTest = 0.5;
                    }

                    object3D = new THREE.Points(geometry, pointsMaterial);

                } else {
                    console.log("3D Mesh Solid terdeteksi!");
                    geometry.computeVertexNormals(); // Hitung pencahayaan
                    
                    let material;
                    // Jika ada tekstur dimasukkan ke mesh solid
                    if (textureInput.files.length > 0) {
                        const texFile = textureInput.files[0];
                        const texUrl = URL.createObjectURL(texFile);
                        const textureLoader = new THREE.TextureLoader();
                        const texture = await textureLoader.loadAsync(texUrl);
                        texture.colorSpace = THREE.SRGBColorSpace;
                        material = new THREE.MeshStandardMaterial({ map: texture });
                    } else {
                        // Jika model solid punya warna vertex bawaan, gunakan warna tersebut
                        const hasColors = geometry.hasAttribute('color');
                        material = new THREE.MeshStandardMaterial({ 
                            color: hasColors ? 0xffffff : 0xcccccc,
                            vertexColors: hasColors 
                        });
                    }
                    object3D = new THREE.Mesh(geometry, material);
                }

                // 3. Gabungkan dalam Scene
                const scene = new THREE.Scene();
                scene.add(object3D);

                // 4. Ekspor ke GLB
                const exporter = new GLTFExporter();
                exporter.parse(
                    scene,
                    function (gltf) {
                        const blob = new Blob([gltf], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        
                        const link = document.createElement('a');
                        link.style.display = 'none';
                        link.href = url;
                        
                        let originalName = plyFile.name.replace('.ply', '');
                        link.download = originalName + '_converted.glb';
                        
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);

                        status.style.color = "green";
                        status.innerText = "Selesai! File GLB berhasil didownload.";
                        convertBtn.disabled = false;
                    },
                    function (error) {
                        console.error(error);
                        status.style.color = "red";
                        status.innerText = "Gagal mengekspor file.";
                        convertBtn.disabled = false;
                    },
                    { binary: true } // Ekspor ke format binary .glb
                );

            } catch (err) {
                console.error(err);
                status.style.color = "red";
                status.innerText = "Error: Terjadi kesalahan saat memproses file.";
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
