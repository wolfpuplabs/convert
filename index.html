<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splat PLY to GLB + 3D Viewer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
        h2 { margin-top: 0; font-size: 1.4rem; color: #333; }
        p.subtitle { font-size: 0.85rem; color:#666; margin-top:-5px; margin-bottom: 20px; }
        input[type="file"] { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; width: calc(100% - 20px); border-radius: 4px; }
        button { padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: background 0.3s;}
        button:hover { background-color: #218838; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; color: #555; font-weight: bold; font-size: 0.9rem; min-height: 20px;}
        
        /* Area 3D Viewer */
        #viewer-container { width: 100%; height: 400px; background-color: #333; margin-top: 20px; border-radius: 8px; overflow: hidden; position: relative; display: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);}
        #viewer-info { position: absolute; top: 10px; left: 10px; color: white; font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; pointer-events: none;}
    </style>
</head>
<body>

    <div class="container">
        <h2>Konverter Gaussian Splat ke GLB</h2>
        <p class="subtitle">Parse warna f_dc & Preview Point Cloud</p>
        
        <input type="file" id="fileInput" accept=".ply">
        <button id="convertBtn">Proses, Preview & Download GLB</button>
        <div id="status">Pilih file Splat .ply</div>

        <!-- 3D Viewer Area -->
        <div id="viewer-container">
            <div id="viewer-info">Preview 3D (Geser untuk memutar, Scroll untuk Zoom)</div>
        </div>
    </div>

    <!-- Import Map untuk Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        const viewerContainer = document.getElementById('viewer-container');

        const SH_C0 = 0.28209479177387814; 

        // --- SETUP 3D VIEWER ---
        const scene = new THREE.Scene();
        // Warna background viewer
        scene.background = new THREE.Color(0x222222); 
        
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Fungsi animasi untuk merender viewer secara terus-menerus
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- FUNGSI UTAMA ---
        convertBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Pilih file terlebih dahulu!");
                return;
            }

            status.innerText = "Membaca & menganalisa file... Mohon tunggu.";
            status.style.color = "#007bff";
            convertBtn.disabled = true;

            try {
                const buffer = await file.arrayBuffer();
                
                // 1. Parsing Header PLY
                const textDecoder = new TextDecoder('utf-8');
                const headerString = textDecoder.decode(new Uint8Array(buffer, 0, Math.min(10000, buffer.byteLength)));
                const headerEndIndex = headerString.indexOf('end_header');
                
                if (headerEndIndex === -1) throw new Error("Format header PLY tidak valid.");
                
                const headerText = headerString.substring(0, headerEndIndex + 10);
                const lines = headerText.split('\n');
                
                let vertexCount = 0;
                let propertyOffsets = {};
                let currentByteOffset = 0;

                for (let line of lines) {
                    if (line.startsWith('element vertex')) {
                        vertexCount = parseInt(line.split(' ')[2]);
                    } else if (line.startsWith('property')) {
                        const parts = line.trim().split(' ');
                        const type = parts[1];
                        const name = parts[2];
                        
                        propertyOffsets[name] = currentByteOffset;
                        
                        if (['float', 'float32', 'int', 'int32'].includes(type)) currentByteOffset += 4;
                        else if (['double', 'float64'].includes(type)) currentByteOffset += 8;
                        else if (['uchar', 'uint8', 'char', 'int8'].includes(type)) currentByteOffset += 1;
                        else if (['ushort', 'uint16', 'short', 'int16'].includes(type)) currentByteOffset += 2;
                    }
                }

                const vertexByteSize = currentByteOffset;
                const headerByteLength = headerText.length + 1; 

                if (!propertyOffsets.hasOwnProperty('x') || !propertyOffsets.hasOwnProperty('f_dc_0')) {
                    throw new Error("Bukan file Gaussian Splatting standar (tidak ada f_dc_0).");
                }

                status.innerText = `Memproses ${vertexCount} partikel...`;

                // 2. Ekstrak Data Binary (Posisi & Warna)
                const dataView = new DataView(buffer, headerByteLength);
                const positions = new Float32Array(vertexCount * 3);
                const colors = new Float32Array(vertexCount * 3);

                for (let i = 0; i < vertexCount; i++) {
                    const baseOffset = i * vertexByteSize;

                    positions[i * 3 + 0] = dataView.getFloat32(baseOffset + propertyOffsets['x'], true);
                    positions[i * 3 + 1] = dataView.getFloat32(baseOffset + propertyOffsets['y'], true);
                    positions[i * 3 + 2] = dataView.getFloat32(baseOffset + propertyOffsets['z'], true);

                    let r = 0.5 + (SH_C0 * dataView.getFloat32(baseOffset + propertyOffsets['f_dc_0'], true));
                    let g = 0.5 + (SH_C0 * dataView.getFloat32(baseOffset + propertyOffsets['f_dc_1'], true));
                    let b = 0.5 + (SH_C0 * dataView.getFloat32(baseOffset + propertyOffsets['f_dc_2'], true));

                    colors[i * 3 + 0] = Math.max(0, Math.min(1, r));
                    colors[i * 3 + 1] = Math.max(0, Math.min(1, g));
                    colors[i * 3 + 2] = Math.max(0, Math.min(1, b));
                }

                // 3. Buat Geometri Point Cloud
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                // Hitung posisi tengah agar model berada di tengah layar viewer
                geometry.computeBoundingSphere();
                const center = geometry.boundingSphere.center;
                geometry.translate(-center.x, -center.y, -center.z);

                const material = new THREE.PointsMaterial({ 
                    size: 0.03, // Ubah jika titik terlalu besar/kecil di viewer
                    vertexColors: true,
                    sizeAttenuation: true 
                });

                const points = new THREE.Points(geometry, material);

                // 4. Tampilkan di Viewer
                scene.clear(); // Bersihkan viewer dari model sebelumnya
                scene.add(points);
                
                viewerContainer.style.display = "block";
                
                // Set ukuran renderer sesuai div container
                const width = viewerContainer.clientWidth;
                const height = viewerContainer.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                
                // Sesuaikan posisi kamera berdasarkan ukuran model
                camera.position.z = geometry.boundingSphere.radius * 2.5;
                camera.updateProjectionMatrix();
                
                viewerContainer.appendChild(renderer.domElement);
                animate(); // Mulai rendering

                // 5. Ekspor ke GLB
                status.innerText = "Mengekspor file GLB...";
                const exporter = new GLTFExporter();
                
                // Kita bungkus ke dalam group agar ekspor bersih
                const exportScene = new THREE.Scene();
                exportScene.add(points.clone());

                exporter.parse(
                    exportScene,
                    function (gltf) {
                        const blob = new Blob([gltf], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        
                        const link = document.createElement('a');
                        link.style.display = 'none';
                        link.href = url;
                        link.download = file.name.replace('.ply', '_splat.glb');
                        
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);

                        status.style.color = "green";
                        status.innerText = "Selesai! Preview 3D ditampilkan dan GLB berhasil didownload.";
                        convertBtn.disabled = false;
                    },
                    function (error) {
                        console.error(error);
                        status.style.color = "red";
                        status.innerText = "Gagal ekspor GLB.";
                        convertBtn.disabled = false;
                    },
                    { binary: true }
                );

            } catch (err) {
                console.error(err);
                status.style.color = "red";
                status.innerText = "Error: " + err.message;
                convertBtn.disabled = false;
            }
        });

        // Pastikan ukuran canvas responsif saat window di-resize
        window.addEventListener('resize', () => {
            if (viewerContainer.style.display === "block") {
                const width = viewerContainer.clientWidth;
                const height = viewerContainer.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }
        });
    </script>
</body>
</html>
