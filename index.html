<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter PLY Binary ke GLB</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input[type="file"] { margin: 1rem 0; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 1rem; color: #555; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Konverter PLY (Point Cloud) ke GLB</h2>
        <input type="file" id="fileInput" accept=".ply">
        <br>
        <button id="convertBtn">Konversi & Download GLB</button>
        <div id="status">Pilih file .ply untuk memulai.</div>
    </div>

    <!-- Import Maps untuk Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');

        convertBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) {
                status.innerText = "Error: Tidak ada file yang dipilih.";
                status.style.color = "red";
                return;
            }

            status.innerText = "Membaca file PLY...";
            status.style.color = "black";

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    status.innerText = "Memproses geometri (Point Cloud)...";
                    
                    const loader = new PLYLoader();
                    const geometry = loader.parse(event.target.result);
                    
                    // Membuat material untuk point cloud
                    const material = new THREE.PointsMaterial({ 
                        size: 0.05, 
                        vertexColors: geometry.hasAttribute('color') 
                    });
                    
                    const points = new THREE.Points(geometry, material);
                    
                    const scene = new THREE.Scene();
                    scene.add(points);

                    status.innerText = "Mengekspor ke GLB...";

                    const exporter = new GLTFExporter();
                    exporter.parse(scene, function (gltf) {
                        const blob = new Blob([gltf], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.style.display = 'none';
                        link.href = url;
                        link.download = file.name.replace('.ply', '.glb');
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        
                        status.innerText = "Konversi berhasil! File sedang didownload.";
                        status.style.color = "green";
                    }, function (error) {
                        status.innerText = "Error saat mengekspor GLB: " + error.message;
                        status.style.color = "red";
                    }, { binary: true });
                } catch (e) {
                    status.innerText = "Error: File PLY rusak atau format tidak didukung.";
                    status.style.color = "red";
                    console.error(e);
                }
            };
            
            reader.onerror = function() {
                status.innerText = "Error membaca file.";
                status.style.color = "red";
            };

            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
